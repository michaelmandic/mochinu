<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochinu - Color Palette</title>
  <link rel="stylesheet" href="colors.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, var(--mochinu-cream) 0%, var(--mochinu-pink) 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 60px;
    }

    h1 {
      font-size: 4rem;
      font-weight: 700;
      color: #333;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
    }

    .subtitle {
      font-size: 1.5rem;
      color: #666;
      font-weight: 300;
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
      margin-bottom: 60px;
    }

    .color-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .color-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
    }

    .color-swatch {
      height: 150px;
      width: 100%;
    }

    .color-info {
      padding: 20px;
    }

    .color-name {
      font-size: 1.3rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
    }

    .color-hex {
      font-size: 1.1rem;
      font-family: 'Courier New', monospace;
      color: #666;
      margin-bottom: 5px;
    }

    .color-rgb {
      font-size: 0.9rem;
      font-family: 'Courier New', monospace;
      color: #999;
      margin-bottom: 10px;
    }

    .color-description {
      font-size: 0.9rem;
      color: #777;
      font-style: italic;
    }

    .footer {
      text-align: center;
      color: #666;
      margin-top: 40px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 10px;
    }

    .copy-notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #333;
      color: white;
      padding: 15px 25px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      display: none;
      animation: slideIn 0.3s ease;
    }

    .copy-notification.show {
      display: block;
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="copy-notification" id="copyNotification">Color copied to clipboard!</div>
  
  <div class="container">
    <header>
      <h1>🍡 Mochinu</h1>
      <p class="subtitle">A soft and colorful color palette inspired by mochi desserts</p>
    </header>

    <div class="palette-grid" id="paletteGrid"></div>

    <div class="footer">
      <p>Click on any color card to copy its hex code to clipboard</p>
      <p style="margin-top: 10px;">Made with ♥ by Michael Mandic</p>
    </div>
  </div>

  <script>
    // Load and display colors
    fetch('colors.json')
      .then(response => response.json())
      .then(data => {
        const grid = document.getElementById('paletteGrid');
        
        Object.entries(data.colors).forEach(([key, color]) => {
          const card = document.createElement('div');
          card.className = 'color-card';
          card.onclick = () => copyToClipboard(color.hex, color.name);
          
          card.innerHTML = `
            <div class="color-swatch" style="background-color: ${color.hex}"></div>
            <div class="color-info">
              <div class="color-name">${color.name}</div>
              <div class="color-hex">${color.hex}</div>
              <div class="color-rgb">rgb(${color.rgb})</div>
              <div class="color-description">${color.description}</div>
            </div>
          `;
          
          grid.appendChild(card);
        });
      })
      .catch(error => console.error('Error loading colors:', error));

    function copyToClipboard(hex, name) {
      navigator.clipboard.writeText(hex).then(() => {
        const notification = document.getElementById('copyNotification');
        notification.textContent = `${name} (${hex}) copied to clipboard!`;
        notification.classList.add('show');
        
        setTimeout(() => {
          notification.classList.remove('show');
        }, 2000);
      });
    }
  </script>
</body>
</html>
